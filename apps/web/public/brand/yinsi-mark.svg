    <circle cx="12" cy="19.5" r="2.2"/>
    <circle cx="4.5" cy="4.5" r="1.6"/>
    <circle cx="19.5" cy="19.5" r="1.6"/>
  </g>
  <circle cx="12" cy="12" r="3.2" fill="#00c805"/>
